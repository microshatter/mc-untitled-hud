name: "Automathic Build Source"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: "Build Source"
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup Java"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: "Build with Gradle"
        run: ./gradlew build

      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: "untitled-hud"
          path: build/libs/*
